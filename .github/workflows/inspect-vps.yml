name: Inspect VPS working tree

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/inspect-vps.yml
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect local server.js changes (read-only)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd ~/radiant
            echo "Working tree summary:"
            git status --short
            echo ""
            echo "server.js diff summary:"
            git diff --stat -- services/radiant-api/src/server.js
            echo ""
            echo "server.js modified line ranges (not contents):"
            git diff --unified=0 -- services/radiant-api/src/server.js | grep '^@@' || true
            echo ""
            echo "Local HEAD:"
            git rev-parse --short HEAD
            echo "Remote tracking HEAD:"
            git rev-parse --short origin/main
