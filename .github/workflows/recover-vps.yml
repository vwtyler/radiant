name: Recover VPS deployment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RECOVER to back up local modifications, sync main, and deploy'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: radiant-vps-deploy
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ inputs.confirm == 'RECOVER' }}
    runs-on: ubuntu-latest
    steps:
      - name: Back up and safely synchronize VPS checkout
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -eu
            umask 077
            cd "$HOME/radiant"
            test "$(git branch --show-current)" = "main" || { echo "Expected main branch; refusing to proceed."; exit 1; }

            # Backups remain outside the Git checkout. Never print their contents.
            backup_dir="$(mktemp -d "$HOME/radiant-recovery-XXXXXXXX")"
            echo "Backup directory: $backup_dir"
            git status --porcelain=v1 > "$backup_dir/git-status.txt"
            git rev-parse HEAD > "$backup_dir/previous-head.txt"
            git diff --binary HEAD -- services/radiant-api/src/server.js scripts/deploy.sh > "$backup_dir/local-changes.patch"

            for file in services/radiant-api/src/server.js scripts/deploy.sh docker-compose.override.yml; do
              if [ -f "$file" ]; then
                mkdir -p "$backup_dir/$(dirname "$file")"
                cp -p "$file" "$backup_dir/$file"
              fi
            done
            echo "Local files and patch backed up successfully."

            # Only the single confirmed conflicting path is stashed.
            # The modified deploy.sh and server-only compose override stay untouched.
            if ! git diff --quiet HEAD -- services/radiant-api/src/server.js; then
              git stash push -m "radiant-vps-recovery-$(date -u +%Y%m%dT%H%M%SZ)" -- services/radiant-api/src/server.js
            fi
            if ! git diff --quiet HEAD -- services/radiant-api/src/server.js; then
              echo "server.js remains modified; refusing to pull."
              exit 1
            fi

            # Fast-forward only: never reset or force-update the VPS checkout.
            git pull --ff-only origin main
            echo "Git checkout synchronized. Local changes remain in backups/stash."

            # Run the repository's existing Docker deployment and health checks.
            "$HOME/radiant/scripts/deploy.sh"
