name: Install dedicated private deployment SSH key

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/install-private-deploy-key.yml"

permissions:
  contents: read

jobs:
  install-public-key:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'setup/install-private-deploy-key'
    runs-on: ubuntu-latest
    steps:
      - name: Authorize new deploy public key on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 1m
          script: |
            set -eu
            umask 077
            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"
            touch "$HOME/.ssh/authorized_keys"
            chmod 600 "$HOME/.ssh/authorized_keys"
            public_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBJ9AEVL8a/HzzQm1s5ar6gUwbPAFs3bMjvTj9KkZ+1+ radiant-deploy-github-actions-2026'
            if ! grep -Fqx "$public_key" "$HOME/.ssh/authorized_keys"; then
              printf '%s\n' "$public_key" >> "$HOME/.ssh/authorized_keys"
              echo "New deploy key authorized."
            else
              echo "Deploy key already authorized."
            fi
